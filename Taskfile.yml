# build/check/package/lint run on host (Linux aarch64+Rust only; CI). docker:* wraps for local dev.
# webOS-specific plumbing in taskfiles/toolchain.yml keeps this file short.
# Release builds are fat LTO natively and in CI, thin in Docker; RELEASE_LTO=fat|thin|false overrides.
version: '3'

silent: true

# TV_HOST and friends come from a gitignored .env — see .env.example.
dotenv: ['.env']

env:
  # CMake workaround for vendored libopus (audiopus_sys via punktfunk-core quic feature).
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  # Prebuilt Skia for armv7; skia-bindings builds from source (~1 hour) without it.
  SKIA_BINARIES_URL: 'https://git.unom.io/unom/skia-binaries/releases/download/0.99.0/skia-binaries-{key}.tar.gz'

includes:
  toolchain:
    taskfile: ./taskfiles/toolchain.yml
    vars:
      NDK_DIR: '{{.NDK_DIR}}'
      SYSROOT: '{{.SYSROOT}}'
      SDL3_PREFIX: '{{.SDL3_PREFIX}}'
      TARGET: '{{.TARGET}}'
      APP_ID: '{{.APP_ID}}'
      RUST_IMAGE: '{{.RUST_IMAGE}}'

vars:
  APP_ID: io.unom.punktfunk.client-webos
  TV_DEVICE: webos-tv
  SSH_KEY: '{{.SSH_KEY | default "$HOME/.ssh/id_rsa"}}'
  NDK_DIR: .toolchains/arm-webos-linux-gnueabi_sdk-buildroot
  SDL3_PREFIX: '{{.ROOT_DIR}}/.toolchains/SDL3-webos'
  SYSROOT: '{{.NDK_DIR}}/arm-webos-linux-gnueabi/sysroot'
  TARGET: armv7-unknown-linux-gnueabi
  # One image for all container tasks (shared cargo/target volumes). trixie for glibc 2.41 (host packages).
  RUST_IMAGE: rust:trixie
  PKG_VERSION:
    sh: |
      if [ -n "${PKG_VERSION:-}" ]; then
        echo "$PKG_VERSION"
      elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "beta" ]; then
        echo "${GITHUB_REF_NAME#v}"
      else
        # Rolling `beta` tag sits on main's tip; use version tags for releases.
        LATEST=$(git describe --tags --abbrev=0 --match '[0-9]*' --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || echo 0.0.1)
        SHA=$(git rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
        echo "${LATEST}+git.${SHA}"
      fi

tasks:
  build:
    desc: >-
      Cross-compile release binary on host (Linux aarch64 with Rust only; CI uses this,
      `docker:build` for local dev).
    deps: [toolchain:all]
    vars:
      # Default fat; docker:build passes thin via -e to avoid env clobber.
      LTO: '{{.RELEASE_LTO | default "fat"}}'
    env:
      # Bakes into binary (core::VERSION); Cargo.toml stays 0.0.1.
      PKG_VERSION: '{{.PKG_VERSION}}'
      CARGO_PROFILE_RELEASE_LTO: '{{.LTO}}'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '{{if eq .LTO "fat"}}1{{else}}16{{end}}'
      SDL3_PREFIX: '{{.SDL3_PREFIX}}'
    cmds:
      - rustup target add {{.TARGET}}
      - cargo build --release --target {{.TARGET}}

  check:
    desc: Cross-target cargo check without Docker (CI entry point)
    deps: [toolchain:all]
    env:
      SDL3_PREFIX: '{{.SDL3_PREFIX}}'
    cmds:
      - rustup target add {{.TARGET}}
      - cargo check --target {{.TARGET}}

  test:
    desc: >-
      Run unit tests on host target. armv7 cross build cannot execute on runner, and lint only
      type-checks. Builds SDL3 from source (`vendored-sdl3`); needs fontconfig, FreeType
      and X11 headers — docker:test brings its own.
    env:
      # Use rust-skia upstream (our mirror is armv7-only).
      SKIA_BINARIES_URL: 'https://github.com/rust-skia/skia-binaries/releases/download/0.99.0/skia-binaries-{key}.tar.gz'
    cmds:
      # `vendored-sdl3`: the host target has no libSDL3 to link against — see Cargo.toml.
      - cargo test --bins --features vendored-sdl3

  lint:
    desc: rustfmt check plus cross-target cargo clippy (Cargo.toml [lints.clippy])
    deps: [toolchain:all]
    env:
      SDL3_PREFIX: '{{.SDL3_PREFIX}}'
    cmds:
      - rustup component add rustfmt
      - cargo fmt --check
      - rustup target add {{.TARGET}}
      - rustup component add clippy
      - cargo clippy --target {{.TARGET}} --all-targets -- -D warnings

  package:
    desc: >-
      Build and package dist/*.ipk (CI only).
      PROBES=1 ships pfprobe for on-device SSH diagnostics.
    deps: [build, toolchain:ares-package]
    cmds:
      - task: toolchain:stage-and-package
        vars:
          PKG_VERSION: '{{.PKG_VERSION}}'
          PROBES: '{{.PROBES}}'

  fmt:
    desc: Format crate with rustfmt (no cross toolchain needed)
    cmds:
      - cargo fmt

  docker:build:
    desc: Cross-compile release binary in Docker (local dev entry point)
    cmds:
      - task: toolchain:docker-run
        vars: {TARGET_TASK: build}

  docker:check:
    desc: Quick cross-target cargo check in Docker (local dev entry point)
    cmds:
      - task: toolchain:docker-run
        vars: {TARGET_TASK: check}

  docker:test:
    desc: Run unit tests in Docker (local dev entry point)
    cmds:
      - task: toolchain:docker-run
        vars:
          TARGET_TASK: test
          EXTRA_APT: >-
            libfontconfig-dev libfreetype-dev libx11-dev libxext-dev libxrandr-dev
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev

  docker:lint:
    desc: Cross-target cargo clippy in Docker (Cargo.toml [lints.clippy])
    cmds:
      - task: toolchain:docker-run
        vars: {TARGET_TASK: lint}

  docker:package:
    desc: Build and package dist/*.ipk in Docker (local dev entry point)
    cmds:
      - task: toolchain:docker-run
        vars:
          TARGET_TASK: package
          PROBES: '{{.PROBES}}'

  register-device:
    internal: true
    deps: [toolchain:ares-device]
    requires:
      vars: [TV_HOST]
    vars:
      TV_IP: '{{splitList "@" .TV_HOST | last}}'
      TV_USER: '{{if contains "@" .TV_HOST}}{{splitList "@" .TV_HOST | first}}{{else}}root{{end}}'
    status:
      - ares-setup-device -l | grep -qE '^{{.TV_DEVICE}}( \(default\))? +{{.TV_USER}}@{{.TV_IP}}:22 '
      - 'ares-setup-device -F | grep -qF "openSshPath : {{.SSH_KEY}}"'
    cmds:
      - ares-setup-device -r {{.TV_DEVICE}} >/dev/null 2>&1 || true
      - >-
        ares-setup-device -a {{.TV_DEVICE}} -i host={{.TV_IP}}
        -i port=22 -i username={{.TV_USER}} -i keyPath="{{.SSH_KEY}}" -i default=true >/dev/null

  deploy:
    desc: >-
      Build, package, install, and launch on real TV via ares-cli-rs.
      Usage: task deploy TV_HOST=root@<tv-ip> (or set in .env).
      TELEMETRY=<host:port> streams logs; TELEMETRY=auto uses LAN IP and random port.
      TELEMETRY_LEVEL (debug/info/warn/error, default debug) sets minimum level.
      UI_SCALE=<factor> overrides panel size for tuning on glass.
    deps: [docker:package, register-device]
    vars:
      IPK: dist/{{.APP_ID}}_{{.PKG_VERSION}}_arm.ipk
      TELEMETRY_LEVEL: '{{.TELEMETRY_LEVEL | default "debug"}}'
    cmds:
      - test -f "{{.IPK}}" || { echo "no {{.IPK}} — packaging failed?" >&2; exit 1; }
      - ares-install -d {{.TV_DEVICE}} "{{.IPK}}"
      - |
        set -eu
        TELEMETRY="{{.TELEMETRY}}"
        if [ "$TELEMETRY" = "auto" ]; then
          IP="$(ipconfig getifaddr en0 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}')"
          PORT="$(awk 'BEGIN { srand(); print int(20000 + rand() * 20000) }')"
          TELEMETRY="${IP}:${PORT}"
        fi

        NC_PID=""
        set -- {{.APP_ID}}
        if [ -n "{{.WEBOS_SDK}}" ]; then
          echo "forcing detected webOS SDK version: {{.WEBOS_SDK}}" >&2
          set -- "$@" -p "webos_sdk={{.WEBOS_SDK}}"
        fi
        if [ -n "{{.UI_SCALE}}" ]; then
          echo "forcing UI scale: {{.UI_SCALE}}" >&2
          set -- "$@" -p "ui_scale={{.UI_SCALE}}"
        fi
        if [ -n "$TELEMETRY" ]; then
          PORT="${TELEMETRY##*:}"
          ( while true; do nc -l "$PORT"; done ) &
          NC_PID=$!
          trap 'kill "$NC_PID" 2>/dev/null || true' EXIT
          echo "listening on :${PORT} (destination sent to device: $TELEMETRY)" >&2
          set -- "$@" -p "telemetry=$TELEMETRY" -p "telemetry_level={{.TELEMETRY_LEVEL}}"
        fi
        ares-launch -d {{.TV_DEVICE}} "$@"
        if [ -n "$NC_PID" ]; then
          wait "$NC_PID"
        fi

  docker:deploy:
    desc: >-
      Like deploy but to container: virtual 1080p over VNC at http://localhost:6080/vnc.html,
      logs to terminal. A punktfunk host installs itself in the same container in the background
      and prints its console URL and password when it is up; the client reaches it at 127.0.0.1.
    cmds:
      - task: toolchain:docker-run
        vars:
          TARGET_TASK: >-
            preview WEBOS_SDK={{.WEBOS_SDK}}
            TELEMETRY_LEVEL={{.TELEMETRY_LEVEL | default "debug"}}
          EXTRA_APT: >-
            libfontconfig-dev libfreetype-dev libx11-dev libxext-dev libxrandr-dev
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri
            xvfb x11vnc novnc websockify netcat-openbsd
          EXTRA_DOCKER: >-
            -p 127.0.0.1:6080:6080 -p 47992:47992
            -v punktfunk-webos-client-home:/root
            -v punktfunk-webos-host-config:/home/pf/.config/punktfunk

  # Entry point inside the docker:deploy container (task CLI, so not internal).
  preview:
    env:
      # Pinned: the real value carries the git SHA, and `core::VERSION` reads it through
      # option_env!, so every commit would invalidate the crate and re-link.
      PKG_VERSION: 0.0.1+preview
      SKIA_BINARIES_URL: 'https://github.com/rust-skia/skia-binaries/releases/download/0.99.0/skia-binaries-{key}.tar.gz'
      TELEMETRY_LEVEL: '{{.TELEMETRY_LEVEL | default "debug"}}'
      WEBOS_SDK: '{{.WEBOS_SDK}}'
    cmds:
      - ./scripts/preview.sh

  clean:
    desc: Remove dist/, .toolchains/, target/, and Docker volumes
    cmds:
      - rm -rf ./dist ./.toolchains ./target
      - docker volume ls -q --filter name=punktfunk-webos- | xargs docker volume rm -f
