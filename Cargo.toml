[package]
name = "punktfunk-webos"
description = "Native LG webOS TV client for punktfunk — session pump direct on punktfunk-core, NDL DirectMedia hardware video decode, SDL2 window/gamepad/remote input."
version = "0.0.1"
edition = "2021"
# Pinned to 1.85: edition-2024 deps (v0.28.0+) require it; only the compiler floor rises.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Volodymyr Dyptan <volodymyr@dyptan.dev>"]
repository = "https://github.com/punktfunk/client-webos"

[[bin]]
name = "punktfunk-webos"
path = "src/main.rs"

[lints.clippy]
cast_lossless = "warn"
map_unwrap_or = "warn"
use_self = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
format_collect = "warn"
suspicious_operation_groupings = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# 🛑 REV (not tag), same across all drei crates: tag+rev mix builds two copies, types won't unify.
punktfunk-core = { git = "https://git.unom.io/unom/punktfunk", rev = "66a890923", features = ["quic"] }
pf-client-core = { git = "https://git.unom.io/unom/punktfunk", rev = "66a890923", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# mDNS LAN discovery; direct dep (not via pf-client-core — see session.rs docs).
mdns-sd = "0.21"
# mTLS game library fetch (services::library).
# ⚠ Spell the ureq TLS feature `rustls-no-provider`, NOT the convenience `rustls` feature: the
# latter expands to `["rustls-no-provider", "_ring", "rustls-webpki-roots"]`, and that `_ring`
# turns on `rustls/ring` where no dependent can switch it off. Naming the backend-free feature
# plus the roots feature is what leaves the choice of provider to us, below.
ureq = { version = "3", features = ["rustls-no-provider", "rustls-webpki-roots"], default-features = false }
# ⚠ Spelled out, not left to rustls's default: this is the line that decides the crypto backend,
# and naming it keeps a second one from creeping back in — rustls refuses to guess when both
# `ring` and `aws_lc_rs` are compiled, and `ClientConfig::builder()` panics rather than picking.
# aws-lc-rs also carries ML-KEM, so the QUIC/mgmt handshakes get post-quantum key exchange.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# JPEG/PNG only; webp adds 163 KB for unused VP8 decoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { version = "0.38", default-features = false }
opus = "0.3"
libc = "0.2"
# 🛑 skia-bindings doesn't fail on missing archive—silently builds from source for ~1hr.
# Logs must say "DOWNLOAD AND INSTALL SUCCEEDED". Keep default features for the archive key
# (`gl-jpegd-jpege-pdf-textlayout`, both sources publish). textlayout is pinned: `skunicode_icu`
# (icudt74_dat, 10.5 MB) is 43% of the binary; kit shapes every string through `Paragraph`.
pf-console-ui = { git = "https://git.unom.io/unom/punktfunk", rev = "66a890923", default-features = false, features = ["gl"] }
skia-safe = { version = "0.99", features = ["gl", "textlayout"] }

[build-dependencies]
serde_json = "1"

[profile.release]
# Hot loops (AEAD decrypt, FEC, QUIC parsing) live in punktfunk-core deps: fat LTO plus
# codegen-units=1 is what inlines them across crates. `RELEASE_LTO=thin` for dev iteration.
lto = "fat"
codegen-units = 1
# No catch_unwind; panic = crash either way. Abort saves binary size + landing pads.
panic = "abort"

[profile.preview]
inherits = "release"
lto = false
codegen-units = 16
