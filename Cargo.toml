[package]
name = "punktfunk-webos"
description = "Native LG webOS TV client for punktfunk — session pump direct on punktfunk-core, NDL DirectMedia hardware video decode, SDL3 window/gamepad/remote input."
version = "0.0.1"
edition = "2021"
# Pinned to 1.85: edition-2024 deps (v0.28.0+) require it; only the compiler floor rises.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Volodymyr Dyptan <volodymyr@dyptan.dev>"]
repository = "https://github.com/punktfunk/client-webos"

[[bin]]
name = "punktfunk-webos"
path = "src/main.rs"

[lints.clippy]
cast_lossless = "warn"
map_unwrap_or = "warn"
use_self = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
format_collect = "warn"
suspicious_operation_groupings = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# REV (not tag), same across all drei crates: tag+rev mix builds two copies, types won't unify.
punktfunk-core = { git = "https://git.unom.io/unom/punktfunk", rev = "7165f0b50", features = ["quic"] }
pf-client-core = { git = "https://git.unom.io/unom/punktfunk", rev = "7165f0b50", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# mDNS LAN discovery; direct dep (not via pf-client-core — see session.rs docs).
mdns-sd = "0.21"
# mTLS game library fetch (services::library).
# Use `rustls-no-provider` (not `rustls`) to defer crypto backend choice to rustls config below.
ureq = { version = "3", features = ["rustls-no-provider", "rustls-webpki-roots"], default-features = false }
# Explicit crypto backend; rustls panics with multiple backends compiled.
# aws-lc-rs provides ML-KEM for post-quantum key exchange.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# JPEG/PNG only; webp adds 163 KB for unused VP8 decoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl3 = { version = "0.20", default-features = false }
# 🛑 `default-features = false` on purpose: sdl3-sys's default `use-pkg-config` would run
# buildroot's pkg-config wrapper, which mangles the webOS release's relocatable `sdl3.pc`
# because it sits outside the NDK sysroot. With no probe feature it falls through to a plain
# `-lSDL3`, and build.rs supplies the search path from $SDL3_PREFIX.
sdl3-sys = { version = "0.7", default-features = false }
opus = "0.3"
libc = "0.2"
# skia-bindings silently builds from ~1hr source if archive missing; logs must say "DOWNLOAD AND INSTALL SUCCEEDED".
# Keep default features for archive. textlayout pinned to avoid icudt74_dat (10.5 MB, 43% of binary).
pf-console-ui = { git = "https://git.unom.io/unom/punktfunk", rev = "7165f0b50", default-features = false, features = ["gl"] }
skia-safe = { version = "0.99", features = ["gl", "textlayout"] }

[features]
# Builds SDL3 from source (cmake) instead of linking a prebuilt one. For `task test` only: it
# runs on the host target, which has no webOS prefix to point at and no distro libSDL3 either
# (Debian bookworm ships none). The webOS build never wants this — it links the fork.
vendored-sdl3 = ["sdl3-sys/build-from-source"]

[build-dependencies]
serde_json = "1"

[profile.release]
# Hot loops (AEAD decrypt, FEC, QUIC parsing) live in punktfunk-core deps: fat LTO plus
# codegen-units=1 is what inlines them across crates. Docker tasks override both to thin/16.
lto = "fat"
codegen-units = 1
# No catch_unwind; panic = crash either way. Abort saves binary size + landing pads.
panic = "abort"
