name: Build

on:
  push:
    branches: [main]
    paths: &build_inputs
      - '*.rs'
      - '*.toml'
      - '*.lock'
      - '*.yml'
      - 'assets/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
  pull_request:
    paths: *build_inputs
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Install Rust (stable, prebuilt) + cross target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi

      - name: Cache cargo registry/git/target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.repository }}-armv7-unknown-linux-gnueabi
          workspaces: |
            . -> target
            . -> target-clippy

      - name: Cache webOS toolchain + ares-package
        uses: actions/cache@v5
        with:
          path: |
            .toolchains
            ~/.cargo/bin/ares-package
          key: webos-toolchain-${{ runner.os }}-${{ hashFiles('taskfiles/toolchain.yml') }}

      - name: Install task
        uses: arduino/setup-task@v3
        with:
          version: 3

      - name: Format check
        run: task fmt-check

      - name: Lint
        run: task lint
        env:
          CARGO_TARGET_DIR: target-clippy

      # SDL2 for the window, fontconfig and FreeType for Skia's text layout (the console kit).
      - name: Install native SDL2 and Skia's text libs for the test build
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libfontconfig-dev libfreetype-dev

      # Runs the tests `lint` only type-checks: the byte-exact report/CRC/resample paths
      # fail silently on the pad, so a green cross-compile proves nothing about them.
      - name: Test
        run: task test

      - name: Build and package
        run: task package

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v7
        with:
          name: io.unom.punktfunk.client-webos
          path: dist/*.ipk
          # Job hand-off only; release runs get the durable copy attached to the release.
          retention-days: 7

  webosbrew:
    needs: package
    permissions:
      contents: write
    uses: ./.github/workflows/webosbrew.yml
    with:
      artifact: io.unom.punktfunk.client-webos
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
