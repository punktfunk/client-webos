version: '3'

silent: true

vars:
  SDL3_RELEASE: release-3.4.16-webos.2
  SDL3_VERSION: 3.4.16
  SDL3_SONAME: libSDL3.so.0.4.16
  # Apt cache persists via removed docker-clean hook (otherwise ephemeral).
  DOCKER_MOUNTS: >-
    -v {{.ROOT_DIR}}:/workspace
    -v punktfunk-webos-toolchains:/workspace/.toolchains
    -v punktfunk-webos-target:/workspace/target
    -v punktfunk-webos-cargo:/opt/punktfunk-webos-cargo
    -v punktfunk-webos-rustup:/usr/local/rustup
    -v punktfunk-webos-apt-cache:/var/cache/apt/archives
    -v punktfunk-webos-apt-lists:/var/lib/apt/lists
    -v punktfunk-webos-tools:/opt/punktfunk-webos-tools
    -w /workspace
    -e CARGO_HOME=/opt/punktfunk-webos-cargo
    -e PATH=/opt/punktfunk-webos-tools/bin:/opt/punktfunk-webos-cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

tasks:
  ndk:
    desc: Fetch the webosbrew/native-toolchain cross-compiler
    status:
      - test -x {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-gcc
    cmds:
      - |
        set -eu
        case "$(uname -s)-$(uname -m)" in
            Linux-aarch64|Linux-arm64) PLATFORM=linux-aarch64 ;;
            *)
                echo "no webosbrew/native-toolchain release for $(uname -s)-$(uname -m) — must run on Linux/aarch64" >&2
                exit 1
                ;;
        esac
        ASSET="arm-webos-linux-gnueabi_sdk-buildroot_${PLATFORM}.tar.bz2"
        URL="https://github.com/webosbrew/native-toolchain/releases/latest/download/${ASSET}"
        mkdir -p "$(dirname {{.NDK_DIR}})"
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        curl -sL -o "$TMP/$ASSET" "$URL"
        tar xjf "$TMP/$ASSET" -C "$(dirname {{.NDK_DIR}})"
        sh {{.NDK_DIR}}/relocate-sdk.sh
        echo 'int main(void) { return 0; }' | {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-gcc \
            --sysroot={{.SYSROOT}} -x c -o "$TMP/probe" -

  sdl3:
    desc: Fetch webosbrew/SDL-webOS (SDL3) into its own prefix
    deps: [ndk]
    requires:
      vars: [SDL3_PREFIX]
    status:
      - test -e {{.SDL3_PREFIX}}/lib/{{.SDL3_SONAME}}
    cmds:
      - |
        set -eu
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        ASSET="SDL3-{{.SDL3_VERSION}}-webos.2.tar.gz"
        URL="https://github.com/webosbrew/SDL-webOS/releases/download/{{.SDL3_RELEASE}}/${ASSET}"
        curl -sL -o "$TMP/$ASSET" "$URL"
        rm -rf {{.SDL3_PREFIX}}
        mkdir -p {{.SDL3_PREFIX}}
        tar xzf "$TMP/$ASSET" -C {{.SDL3_PREFIX}}
        test -e {{.SDL3_PREFIX}}/lib/{{.SDL3_SONAME}}
        test -e {{.SDL3_PREFIX}}/include/SDL3/SDL.h

  all:
    desc: Fetch the full webOS cross-toolchain
    deps: [sdl3]

  ares-package:
    desc: Install ares-package (webosbrew/ares-cli-rs) if it isn't already on PATH
    status:
      - command -v ares-package
    cmds:
      - cargo install --locked --git https://github.com/webosbrew/ares-cli-rs ares-package

  ares-device:
    desc: >-
      Install ares-cli-rs device tools (setup-device/install/launch) for deploy,
      if not already on PATH
    status:
      - command -v ares-setup-device
      - command -v ares-install
      - command -v ares-launch
    cmds:
      - >-
        cargo install --locked --git https://github.com/webosbrew/ares-cli-rs
        ares-setup-device ares-install ares-launch

  stage-and-package:
    internal: true
    requires:
      vars: [PKG_VERSION, TARGET, NDK_DIR, SYSROOT, SDL3_PREFIX]
    cmds:
      - |
        set -eu
        STAGE_DIR="$(mktemp -d)"
        trap 'rm -rf "$STAGE_DIR"' EXIT
        mkdir -p "$STAGE_DIR/bin" "$STAGE_DIR/lib"
        cp target/{{.TARGET}}/release/punktfunk-webos "$STAGE_DIR/bin/"
        cp -L {{.SDL3_PREFIX}}/lib/libSDL3.so.0 "$STAGE_DIR/lib/libSDL3.so.0"
        # libstdc++ linked statically; bundled versions break TV's DT_RPATH.
        # Bundle FreeType 2.13 COLRv1 support; webOS 9.0+ has entry points Skia needs.
        cp -L {{.SYSROOT}}/usr/lib/libfreetype.so.6 "$STAGE_DIR/lib/libfreetype.so.6"
        {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-strip \
          "$STAGE_DIR/bin/punktfunk-webos" "$STAGE_DIR/lib/libSDL3.so.0" \
          "$STAGE_DIR/lib/libfreetype.so.6"
        # PROBES=1 ships pfprobe (diagnostics CLI); omit by default (250KB, SSH-only).
        if [ -n "{{.PROBES}}" ]; then
          cp "target/{{.TARGET}}/release/pfprobe" "$STAGE_DIR/bin/"
          {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-strip "$STAGE_DIR/bin/pfprobe"
        fi
        cp packaging/appinfo.json packaging/icon.png packaging/icon_large.png packaging/splash.png "$STAGE_DIR/"

        PKG_VERSION="{{.PKG_VERSION}}"
        case "$PKG_VERSION" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "error: PKG_VERSION '${PKG_VERSION}' is not x.x.x[+git.sha]" >&2; exit 1 ;;
        esac
        sed -i.bak "s/\"version\": \"0.0.1\"/\"version\": \"${PKG_VERSION}\"/" "$STAGE_DIR/appinfo.json"
        rm -f "$STAGE_DIR/appinfo.json.bak"
        mkdir -p dist
        ares-package "$STAGE_DIR" -o dist --force-arch arm

  # Thin LTO in Docker (faster iteration); Fat LTO for native/CI; RELEASE_LTO overrides.
  docker-run:
    internal: true
    requires:
      vars: [TARGET_TASK]
    vars:
      LTO: '{{.RELEASE_LTO | default "thin"}}'
      CODEGEN_UNITS: '{{if eq .LTO "fat"}}1{{else}}16{{end}}'
    cmds:
      - |
        set -eu
        TTY=""
        [ -t 0 ] && TTY="-it"
        docker run --rm $TTY --platform linux/arm64 -e DEBIAN_FRONTEND=noninteractive \
          -e RELEASE_LTO={{.LTO}} \
          -e CARGO_PROFILE_RELEASE_LTO={{.LTO}} \
          -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS={{.CODEGEN_UNITS}} \
          -e PKG_VERSION={{.PKG_VERSION}} \
          {{.EXTRA_DOCKER}} {{.DOCKER_MOUNTS}} {{.RUST_IMAGE}} \
          sh -c '
            rm -f /etc/apt/apt.conf.d/docker-clean &&
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends cmake {{.EXTRA_APT}} > /dev/null &&
            if ! command -v task > /dev/null 2>&1; then
              curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /opt/punktfunk-webos-tools/bin > /dev/null;
            fi &&
            task {{.TARGET_TASK}} PROBES={{.PROBES}}
          '
